<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skyline Platformer</title>
  <link rel="stylesheet" href="platformer.css" />
</head>
<body>
  <main class="game-shell">
    <section class="hud" aria-label="Game status">
      <div>
        <p class="eyebrow">Platformer</p>
        <h1>Skyline Run</h1>
      </div>
      <div class="stats">
        <div><span>Coins</span><strong id="coinCount">0</strong></div>
        <div><span>Lives</span><strong id="lifeCount">3</strong></div>
        <div><span>Time</span><strong id="timeCount">0:00</strong></div>
      </div>
    </section>

    <section class="stage-wrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Playable platformer game"></canvas>
      <div class="mobile-controls" aria-label="Touch controls">
        <button id="leftButton" type="button">Left</button>
        <button id="rightButton" type="button">Right</button>
        <button id="jumpButton" type="button">Jump</button>
        <button id="shootButton" type="button">Shoot</button>
      </div>
    </section>

    <section class="panel">
      <div>
        <p class="eyebrow">Goal</p>
        <h2 id="message">Collect coins and reach the green portal.</h2>
        <p id="subMessage">Arrow keys or A/D move. W or Up jumps, press jump again for a double jump, and Space shoots.</p>
      </div>
      <button id="restartButton" type="button">Restart</button>
    </section>
  </main>

  <script src="platformer.js"></script>
</body>
</html>
